    <script>
      const trailer = document.getElementById("trailer");

      // Follow mouse movement
      window.onmousemove = (e) => {
        const x = e.clientX - trailer.offsetWidth / 2;
        const y = e.clientY - trailer.offsetHeight / 2;
        trailer.style.transform = `translate(${x}px, ${y}px)`;
      };

      // Elements to trigger hover effect (links and images)
      const hoverTargets = document.querySelectorAll("a, img, li");

      hoverTargets.forEach((element) => {
        element.addEventListener("mouseover", () => {
          trailer.style.width = "40px";   // Increase width
          trailer.style.height = "40px";  // Increase height
          trailer.style.backgroundColor = "transparent";  // Make background transparent
          trailer.style.border = "2px solid white";  // Add white border
          trailer.style.borderRadius = "50%";  // Keep it a circle
        });

        element.addEventListener("mouseout", () => {
          trailer.style.width = "15px";   // Revert to original width
          trailer.style.height = "15px";  // Revert to original height
          trailer.style.backgroundColor = "white";  // Revert background to white
          trailer.style.border = "none";  // Remove border
          trailer.style.borderRadius = "50%";  // Keep it a circle
        });
      });


    </script>

    <script>
      const menu = {
        element: document.querySelector('.menu'),
        pages: document.querySelectorAll('.menu_row_pages > h2'),
        info: document.querySelectorAll('.menu_row_info > div > span'),
        title: document.querySelectorAll('.menu_row_title > h1'),
        media: document.querySelector('.menu_row_media'),
      }

      const button = {
        element: document.querySelector('.nav_menu_button'),
        text: document.querySelectorAll('.nav_menu_button_text > span'),
        open: document.querySelector('.--open-menu'),
        close: document.querySelector('.--close-menu'),
      }

      const clipPath = {
        init: 'inset(0% 0% 0% 0%)',
        bottom: 'inset(100% 0% 0% 0%)',
        top: 'inset(0% 0% 100% 0%)',
      }

      const tlMenu = gsap.timeline({
        paused: true,
        defaults: { duration: 1.6, ease: 'expo.inOut' },
      })

      let isEnabled = false

      const initMenu = () => {
        gsap.set(menu.element, { pointerEvents: 'none', clipPath: clipPath.bottom })
        gsap.set(menu.pages, { yPercent: 100, autoAlpha: 0 })
        gsap.set(menu.info, { yPercent: 100, autoAlpha: 0 })
        gsap.set(menu.title, { yPercent: 100, rotateY: 20, scale: 0.2 })
        gsap.set(menu.media, { clipPath: clipPath.bottom })

        animateInnerMenu()
      }

      const animateMenu = () => {
        if (!isEnabled) {
          gsap.to(menu.element, {
            duration: 1.2,
            pointerEvents: 'auto',
            clipPath: clipPath.init,
            ease: 'expo.inOut',
          })
        } else {
          gsap.to(menu.element, {
            duration: 0.8,
            clipPath: clipPath.top,
            ease: 'expo.inOut',
            onComplete: () => {
              gsap.set(menu.element, { pointerEvents: 'none', clipPath: clipPath.bottom })
            }
          })
        }
      }

      const animateInnerMenu = () => {
        tlMenu.to(
          menu.pages,
          {
            yPercent: 0,
            autoAlpha: 1,
            stagger: 0.032,
          },
          0.24
        ).to(
          menu.info,
          {
            yPercent: 0,
            autoAlpha: 1,
            stagger: 0.032,
          },
          0.24
        ).to(
          menu.title,
          {
            yPercent: 0,
            rotateY: 0,
            scale: 1,
            stagger: 0.032,
          },
          0
        ).to(
          menu.media,
          {
            clipPath: clipPath.init,
          },
          0
        )
      }

      const animateButton = (text) => {
        gsap.timeline()
          .to(button.element, {
            duration: 0.8,
            autoAlpha: 0,
            pointerEvents: 'none',
            ease: 'expo.inOut',
            onComplete: () => {
              button.text[0].textContent = text
            }
          })
          .to(button.element, {
            duration: 0.8,
            autoAlpha: 1,
            pointerEvents: 'auto',
          })
      }

      const addEventListenerss = () => {
        button.open.addEventListener('click', () => {
          if (!isEnabled) {
            animateMenu()
            animateButton('Close')
            tlMenu.play()
          } else {
            animateButton('Menu')
            animateMenu()
            tlMenu.reverse(2)
          }

          isEnabled = !isEnabled
        })
      }

      window.addEventListener('DOMContentLoaded', () => {
        initMenu()
        addEventListenerss()
      })

    </script>

    <script>
      gsap.registerPlugin(ScrollTrigger)
      let lenis

      const navAnchors = document.querySelectorAll('.nav_item_anchor')
      const galleryRows = document.querySelectorAll('.gallery_row')
      const goToTop = document.querySelectorAll('.--top')

      const initLenis = () => {
        lenis = new Lenis({
          smoothWheel: true,
          smoothTouch: true,
        })

        lenis.on('scroll', ScrollTrigger.update)

        gsap.ticker.add((time) => {
          lenis.raf(time * 1000)
        })
        gsap.ticker.lagSmoothing(0)

        lenis.scrollTo(0, { immediate: true })
        initScrollTrigger()
      }

      const initScrollTrigger = () => {
        const hero = document.querySelector('.hero_top')
        const images = document.querySelectorAll('.gallery_row_media_image')

        gsap.utils.toArray(images).forEach((image) => {
          gsap.set(image, { scale: 1.2 })

          const imageRect = image.getBoundingClientRect()
          const heightDifference = image.height - image.parentElement.offsetHeight

          gsap.fromTo(image, {
            y: -heightDifference,
          },
            {
              scrollTrigger: {
                trigger: image,
                start: 'top center+=30%',
                end: 'bottom+=10% top',
                scrub: true,
              },
              y: heightDifference,
              ease: 'none',
            }
          )

          const tlHero = gsap.timeline({
            scrollTrigger: {
              trigger: hero,
              start: 'top top',
              end: 'center top',
              scrub: true,
            },
          })
          tlHero.to(hero, {
            autoAlpha: 0,
          })
        })
      }

      const addEventListeners = () => {

      }

      window.onload = () => {
        initLenis()
        addEventListeners()
      }
    </script>
